<!DOCTYPE html>
<html>
<head>
    <title>Notes App</title>
</head>
<body>

    <h1>Notes App</h1>

    <form method="GET">
        <input type="text" name="search" placeholder="Search notes">
        <button type="submit">Search</button>
    </form>

    <hr>

    <form action="/add" method="POST">
        <input type="text" name="title" placeholder="Title" required>
        <br><br>

        <textarea name="content" placeholder="Write note..." required></textarea>
        <br><br>

        <button type="submit">Add Note</button>
    </form>

    <hr>

    {% for note in notes %}
        <h3>{{ note[1] }}</h3>

        <p>{{ note[2] }}</p>

        <small>{{ note[3] }}</small>

        <br>

        <a href="/edit/{{ note[0] }}">Edit</a>
        <a href="/delete/{{ note[0] }}">Delete</a>

        <hr>
    {% endfor %}

</body>
</html>
